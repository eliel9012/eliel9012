<svg xmlns="http://www.w3.org/2000/svg" width="420" height="118" viewBox="0 0 420 118" role="img" aria-labelledby="title desc">
  <title id="title">GPS-Globe</title>
  <desc id="desc">Real-time GPS globe with receiver position and satellite metadata.</desc>
  <rect x="1" y="1" width="418" height="116" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="28" cy="30" r="10" fill="#3572A5"/>
  <text x="48" y="35" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#0969da">GPS-Globe</text>
  <text x="20" y="63" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">Real-time GPS globe with live receiver position,</text>
  <text x="20" y="82" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">orbital context and satellite metadata.</text>
  <circle cx="24" cy="101" r="5" fill="#3572A5"/>
  <text x="36" y="105" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Python</text>
