name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: eliel9012
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: eliel9012
          template: classic
          filename: github-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_timezone: America/Sao_Paulo

      - name: Stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: eliel9012
          template: classic
          filename: github-stars.svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4
          config_timezone: America/Sao_Paulo
