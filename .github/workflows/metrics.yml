name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml
  workflow_dispatch:

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: eliel9012
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          repositories_batch: 25
          config_timezone: America/Sao_Paulo

      - name: Stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: eliel9012
          template: classic
          filename: github-stars.svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4
          config_timezone: America/Sao_Paulo
